server:
  port: 8080

spring:
  h2:
    console:
      path: /h2-console
      enabled: true

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:discodeit_user
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create

logging:
  level:
    root: info
    com.sprint.mission.discodeit: debug

